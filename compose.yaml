x-mongo-environment: &mongo-environment
  MONGO_URI: mongodb://mongo:27017
  MONGO_DBNAME: ${MONGO_DBNAME:-expirymate}

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: ./web-app
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    environment:
      <<: *mongo-environment
      ML_URL: ${ML_URL:-http://ml:8000}
      MOCK_OCR: ${MOCK_OCR:-0}
      SECRET_KEY: ${SECRET_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  ml:
    profiles: ["full"]
    build: ./machine-learning-client
    expose:
      - "8000"
    environment:
      <<: *mongo-environment
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
